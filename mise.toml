# The pinned toolchain (docs/spec/11-engineering.md §1). Renovate keeps these current.
# Node and pnpm are required; the scanners are the same binaries CI runs, so the lefthook
# pre-commit hook and the gate checks work locally without global installs. mise.lock records
# each tool's download URL and SHA-256 for the CI platforms; CI installs with `--locked`.
[tools]
node = "26.13.1"
pnpm = "12.21.0"
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
"github:oasdiff/oasdiff" = "1.39.0"
syft = "1.57.2"
