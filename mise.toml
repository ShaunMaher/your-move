# The pinned toolchain (docs/spec/11-engineering.md §1). Renovate keeps these current.
# Node and pnpm are required; the three scanners are the same binaries CI runs, so the
# lefthook pre-commit hook and the gate checks work locally without global installs.
[tools]
node = "26.13.1"
pnpm = "12.21.0"
gitleaks = "8.30.1"
osv-scanner = "2.7.1"
"github:oasdiff/oasdiff" = "1.39.0"
