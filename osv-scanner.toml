# OSV-Scanner (docs/spec/11-engineering.md §6). A known vulnerability fails the pipeline unless it
# is ignored here with an `ignoreUntil` date and a `reason` naming its accepted-risk entry
# (F-<n>) in docs/security/findings.md, which carries the same expiry. Nothing else may be set
# here: `pnpm lint:vulns` refuses any other key, since PackageOverrides can silence findings too.
# Example:
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-01-31
# reason = "F-12: dev-only dependency, not reachable from production code"
