packages:
  - apps/*
  - packages/*
  - games/*
  - scripts
  - tests/*

# Supply chain (docs/spec/08-security.md §6, 11-engineering.md §6).
# Only these packages may run install scripts; every other build script is blocked.
allowBuilds:
  # Scoped to the catalog's esbuild (edit this key with every esbuild bump; renovate.json says so).
  # drizzle-kit's own esbuild copies don't need their install scripts: their bin stays the JS shim,
  # which finds the platform binary through its optional dependency (M2a review S-5).
  esbuild@0.28.2: true
  esbuild@0.18.20 || 0.25.12: false
  workerd: true
  sharp: false
  lefthook: false
strictDepBuilds: true
# New versions must have been public for three days before they can be installed (Renovate uses
# the same delay, 11 §8).
minimumReleaseAge: 4320
strictPeerDependencies: true
engineStrict: true
peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares typescript ^5 but works with 6.0 (same compiler API). Remove once
    # it declares 6.x.
    openapi-typescript>typescript: "6"

# Every dependency version is pinned exactly, once, here. Packages refer to it as "catalog:".
