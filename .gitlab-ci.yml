# The pipeline (docs/spec/11-engineering.md §9, 09 §6, 08 §6).
#
# validate, test, build, e2e and security run on every merge request; publish runs only on main
# and v* tags. The deploy stage stays in the list: the Cloudflare deploy job arrives with the first
# Workers deployment (09 §6). Every job is unprivileged (no Docker-in-Docker). Secrets live only in
# variables that are both protected and scoped to one environment (release, renovate, production):
# our GitLab is Community Edition, which has no protected environments, so only jobs on protected
# refs that declare the environment receive them.
#
# Tools are verified, never piped into a shell: scripts/ci/install-mise.sh checks the mise release
# against a committed SHA-256 on every run, and mise installs pnpm and the scanners with
# `--locked` against mise.lock. Caches (.pnpm-store, .mise) live inside the project directory, are
# kept per architecture, written by one job per architecture, and ignored by every scanner.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

stages:
  - validate
  - test
  - build
  - e2e
  - security
  - publish
  - deploy

variables:
  # Images pinned by digest; Renovate updates tag and digest together (renovate.json).
  # The full Node image, not -slim, for every Node job: it has git and the system CA certificates
  # that tools outside Node verify TLS with (workerd in the Worker contract tests, osv-scanner).
  # The -slim image has neither; the server image (Dockerfile) stays -slim, since Node's own TLS
  # uses its bundled roots.
  # renovate: datasource=docker depName=node
  NODE_IMAGE: node:26.13.1-trixie@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
  # renovate: datasource=docker depName=mcr.microsoft.com/playwright
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
  # The maintained kaniko fork (ADR 0003, F-10).
  # renovate: datasource=docker depName=ghcr.io/osscontainertools/kaniko
  KANIKO_IMAGE: ghcr.io/osscontainertools/kaniko:v1.29.2-debug@sha256:b3cadc638a5b0a7e8ae7b3b76704821b2b5f191163222da401283541c8fa2d41
  # renovate: datasource=docker depName=gcr.io/go-containerregistry/crane
  CRANE_IMAGE: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
  # renovate: datasource=docker depName=curlimages/curl
  CURL_IMAGE: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  # renovate: datasource=docker depName=renovate/renovate
  RENOVATE_IMAGE: renovate/renovate:44.258.0@sha256:2948b8ed46aceac257f0488699272960efea87ee2644007368e64925c5d874fd
  # Caches are per architecture: mise's tools and native packages (workerd, esbuild) differ, so an
  # arm64 job must never restore amd64 binaries. Jobs on the arm64 runner set CACHE_ARCH: arm64.
  CACHE_ARCH: amd64
  # Caches inside the project directory (the only place GitLab caches). pnpm 12 reads its settings
  # from pnpm_config_* variables (it ignores npm_config_*); .pnpm checks the store is really here.
  MISE_DATA_DIR: $CI_PROJECT_DIR/.mise
  pnpm_config_store_dir: $CI_PROJECT_DIR/.pnpm-store
  # The image repository; the name is the project's, never a product name (09 §4).
  IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE/server
  WRANGLER_SEND_METRICS: "false"
  FF_TIMESTAMPS: "true"
  # The game kit's CPU budget on our runners (08 T25, docs/deploy.md "CI runners"): the shared
  # amd64 runner is a qemu64 VM without SSE4.2, 2-3x slower than a developer laptop and often
  # running several pipelines at once, so 4x the 5 ms reference budget. One variable for every
  # kit run here: the testkit reads it whenever a run isn't given a budget, so the packages' own
  # kit tests (test), games:verify in `pnpm build` (build:app) and the full kit (test) use it, and
  # the image build gets it as a --build-arg. Developer machines keep the real 5 ms.
  KIT_CPU_BUDGET_MS: "20"

default:
  interruptible: true
  timeout: 20 minutes

# --- Templates --------------------------------------------------------------------------------

.every-pipeline:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.merge-requests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.main-and-tags:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

# Only the validate job (amd64) and test:worker (arm64) write the caches; every other job reads.
.caches:
  cache:
    - key:
        prefix: pnpm-$CACHE_ARCH
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull
    - key:
        prefix: mise-$CACHE_ARCH
        files: [mise.lock]
      paths: [.mise]
      policy: pull

# The pnpm store must be the cached one inside the project directory (F-8): never a path that MR
# and main jobs could share on the runner.
.store-in-project: &store-in-project |
  store="$(pnpm store path)"
  case "$store" in
    "$CI_PROJECT_DIR"/.pnpm-store/*) echo "pnpm store: $store" ;;
    *) echo "pnpm's store is $store, outside $CI_PROJECT_DIR/.pnpm-store: is pnpm_config_store_dir set?"; exit 1 ;;
  esac

# What a runner offers workerd, printed when a test job fails: CPU model, flags and the x86-64
# levels glibc sees, kernel, CPUs, memory, and whether the workerd binary starts at all.
.runner-report: &runner-report |
  if [ "$CI_JOB_STATUS" = "failed" ]; then
    grep -m1 '^model name' /proc/cpuinfo || true
    grep -m1 -E '^(flags|Features)' /proc/cpuinfo || true
    if [ -x /lib64/ld-linux-x86-64.so.2 ]; then /lib64/ld-linux-x86-64.so.2 --help | grep -i 'x86-64-v' || true; fi
    uname -a
    echo "nproc: $(nproc)"
    grep -E '^(MemTotal|MemAvailable)' /proc/meminfo || true
    for workerd in node_modules/.pnpm/@cloudflare+workerd-linux-*/node_modules/@cloudflare/workerd-linux-*/bin/workerd; do
      "$workerd" --version; echo "$workerd --version exited $?"
    done
  fi

# Node, pnpm (and any MISE_TOOLS) from mise.lock, and the workspace installed.
.pnpm:
  extends: .caches
  image: $NODE_IMAGE
  variables:
    MISE_TOOLS: ""
  before_script:
    # shellcheck disable=SC2086 # MISE_TOOLS is a list of tool names.
    - scripts/ci/install-mise.sh pnpm $MISE_TOOLS
    - export PATH="$MISE_DATA_DIR/bin:$MISE_DATA_DIR/shims:$PATH"
    - *store-in-project
    # `prepare` runs games:generate (11 §3); git hooks are skipped in CI.
    - pnpm install --frozen-lockfile

# Collapsible log sections: `section NAME "Title"` … `end NAME`.
.sections: &sections |
  section() { printf '\e[0Ksection_start:%s:%s\r\e[0K%s\n' "$(date +%s)" "$1" "$2"; }
  end() { printf '\e[0Ksection_end:%s:%s\r\e[0K\n' "$(date +%s)" "$1"; }

# --- 1. validate -------------------------------------------------------------------------------

# One job for every static gate, so the workspace is installed once; it also fills the caches.
validate:
  stage: validate
  extends: [.pnpm, .every-pipeline]
  cache:
    - key:
        prefix: pnpm-$CACHE_ARCH
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull-push
    - key:
        prefix: mise-$CACHE_ARCH
        files: [mise.lock]
      paths: [.mise]
      policy: pull-push
  variables:
    # Every tool any job installs, so this job fills the mise cache for all of them.
    MISE_TOOLS: gitleaks github:oasdiff/oasdiff osv-scanner syft
    GIT_DEPTH: "0"
  script:
    - *sections
    - section format "Prettier"; pnpm format:check; end format
    - section lint "ESLint"; pnpm lint; end lint
    - section typecheck "TypeScript"; pnpm typecheck; end typecheck
    - section arch "Architecture rules"; pnpm lint:arch; end arch
    - section unused "knip"; pnpm lint:unused; end unused
    - section pins "Toolchain pins"
    - pnpm lint:pins
    - |
      mise lock --check || { echo "mise.lock is out of date: run 'mise lock' and commit mise.lock"; exit 1; }
    - end pins
    - section generated "Committed generated code"
    - pnpm api:generate
    - pnpm renovate:sync
    - pnpm api:surface
    - git diff --exit-code -- packages/api-client renovate.json packages/sdk/api-report
    - end generated
    - section gates "Each gate fails on a deliberate violation"; pnpm gates:prove; end gates
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        section mr "Merge request checks"
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        # Conventional Commits on every commit and on the title (squash commits use it, 11 §7),
        # without the Draft/WIP marker GitLab adds.
        pnpm exec commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD --verbose
        printf '%s\n' "$CI_MERGE_REQUEST_TITLE" \
          | sed -E 's/^(\[(Draft|WIP)\]|\((Draft|WIP)\)|(Draft|WIP):)[[:space:]]*//I' \
          | pnpm exec commitlint --verbose
        # A changeset for every change to a published package; Renovate MRs are exempt (11 §7).
        case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
          renovate/*) echo "Renovate MR: no changeset needed" ;;
          *) pnpm exec changeset status --since="$CI_MERGE_REQUEST_DIFF_BASE_SHA" ;;
        esac
        # No breaking change within /api/v1 (05 §Versioning).
        if git show "$CI_MERGE_REQUEST_DIFF_BASE_SHA:packages/api-client/openapi/v1.json" > /tmp/openapi-base.json 2>/dev/null; then
          oasdiff breaking /tmp/openapi-base.json packages/api-client/openapi/v1.json --fail-on ERR
        else
          echo "The target branch has no OpenAPI document yet: nothing to compare"
        fi
        end mr
      fi

# --- 2. test -----------------------------------------------------------------------------------

test:
  stage: test
  extends: [.pnpm, .every-pipeline]
  needs: [validate]
  variables:
    # Wrangler's own log file goes where the artifacts can keep it.
    WRANGLER_LOG_PATH: $CI_PROJECT_DIR/reports/wrangler-logs
  script:
    # Unit, integration, property, component and API contract tests. The Worker half of the
    # contract suite runs in test:worker instead (see there): to fold it back, drop the --exclude
    # and the test:worker job. Vitest matches --exclude against each project's own directory, so
    # only an absolute path names this one file and no other.
    - pnpm test --exclude "$CI_PROJECT_DIR/tests/contract/src/worker.test.ts"
    # The full game kit and every other games:verify check on each installed game (02 §6, 11 §4);
    # the build stage runs the fast kit.
    - pnpm games:verify
  after_script:
    # The Worker build writes Wrangler's log, but a job that fails earlier writes none: an empty
    # directory keeps the artifact upload from warning.
    - mkdir -p "$WRANGLER_LOG_PATH"
    - *runner-report
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    # Wrangler's logs can carry the test configuration; only project members read them.
    access: developer
    paths:
      - reports/wrangler-logs/
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

# The Worker half of the contract suite (workerd), on the arm64 runner. It is a separate job only
# because the amd64 shared runner's VM CPU lacks SSE4.2 (x86-64-v2), which workerd's linux-64
# build needs (M0 review CI-1; docs/deploy.md). Once that runner offers x86-64-v2, delete this job
# and the --exclude in `test`. It covers no sources of its own, so coverage stays with `test`.
test:worker:
  stage: test
  extends: [.pnpm, .every-pipeline]
  tags: [arch-arm64]
  needs: [validate]
  variables:
    CACHE_ARCH: arm64
    WRANGLER_LOG_PATH: $CI_PROJECT_DIR/reports/wrangler-logs
  # The only job on the arm64 runner that uses the caches, so it writes that architecture's.
  cache:
    - key:
        prefix: pnpm-$CACHE_ARCH
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull-push
    - key:
        prefix: mise-$CACHE_ARCH
        files: [mise.lock]
      paths: [.mise]
      policy: pull-push
  script:
    # The contract project's global setup builds the web app, Node server and Worker first.
    - pnpm exec vitest run --project tests/contract src/worker.test.ts
  after_script:
    - mkdir -p "$WRANGLER_LOG_PATH"
    - *runner-report
  artifacts:
    when: always
    expire_in: 1 week
    access: developer
    paths:
      - reports/wrangler-logs/
    reports:
      junit: reports/junit.xml

# --- 3. build ----------------------------------------------------------------------------------

build:app:
  stage: build
  extends: [.pnpm, .every-pipeline]
  needs: [validate]
  script:
    # games:generate, games:verify --fast, then every package: web, Node server, Worker bundle.
    - pnpm build
    # CycloneDX SBOMs of what each deployment ships: the production dependencies of the root
    # (installed games, from M1), the web app (bundled into the SPA) and the Node server or the
    # Worker. The image's own SBOM (base image and all) comes from its build job.
    - pnpm sbom:app
  artifacts:
    expire_in: 1 week
    paths:
      - apps/web/dist/
      - apps/node/dist/
      - apps/worker/dist/
      - generated/installed.json
      - sbom/
      # Built output of the packages Changesets publishes from main.
      - packages/*/dist/
      - games/*/dist/

# Native per-architecture image builds with kaniko: no daemon, no privileges, no user namespaces.
# Merge requests build without keeping the image; main and tags keep the tarball for the publish
# job and write its SBOM from the image itself. `--cleanup` removes the built image's filesystem
# from the job container afterwards, so the SBOM step runs in kaniko's own busybox environment.
.build-image:
  stage: build
  extends: .every-pipeline
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  needs: []
  script:
    - |
      set -eu
      tar_args=""
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        mkdir -p images
        tar_args="--tar-path images/image-$ARCH.tar"
      fi
      # shellcheck disable=SC2086 # tar_args is either empty or two words.
      /kaniko/executor \
        --context "dir://$CI_PROJECT_DIR" \
        --dockerfile apps/node/Dockerfile \
        --custom-platform "linux/$ARCH" \
        --build-arg "IMAGE_TITLE=$CI_PROJECT_NAME" \
        --build-arg "IMAGE_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" \
        --build-arg "IMAGE_REVISION=$CI_COMMIT_SHA" \
        --build-arg "IMAGE_SOURCE=$CI_PROJECT_URL" \
        --build-arg "IMAGE_PIPELINE_ID=$CI_PIPELINE_ID" \
        --build-arg "IMAGE_PIPELINE_URL=$CI_PIPELINE_URL" \
        --build-arg "KIT_CPU_BUDGET_MS=$KIT_CPU_BUDGET_MS" \
        --snapshot-mode=redo \
        --cleanup \
        --no-push \
        --destination "$IMAGE_REPOSITORY:$CI_COMMIT_SHA-$ARCH" \
        $tar_args
      if [ -f "images/image-$ARCH.tar" ]; then
        sh scripts/ci/install-syft.sh /tmp/syft
        /tmp/syft/syft scan "docker-archive:images/image-$ARCH.tar" \
          -o "cyclonedx-json=images/sbom-$ARCH.cdx.json"
      fi
  artifacts:
    expire_in: 2 days
    paths: [images/]

build:image:amd64:
  extends: .build-image
  tags: [arch-amd64]
  variables:
    ARCH: amd64

build:image:arm64:
  extends: .build-image
  tags: [arch-arm64]
  variables:
    ARCH: arm64

# --- 4. e2e ------------------------------------------------------------------------------------

e2e:
  stage: e2e
  extends: [.pnpm, .every-pipeline]
  image: $PLAYWRIGHT_IMAGE
  needs: [build:app]
  parallel: 2
  script:
    # Against the Node build output from build:app, never the Docker image (11 §9).
    - pnpm --filter @your-move/e2e exec playwright test --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/e2e/test-results/
      - tests/e2e/playwright-report/
    reports:
      junit: reports/e2e-junit.xml

# --- 5. security -------------------------------------------------------------------------------

security:secrets:
  stage: security
  extends: .every-pipeline
  image: $NODE_IMAGE
  needs: []
  cache:
    - key:
        prefix: mise-$CACHE_ARCH
        files: [mise.lock]
      paths: [.mise]
      policy: pull
  variables:
    GIT_DEPTH: "0"
  before_script:
    - scripts/ci/install-mise.sh gitleaks
    - export PATH="$MISE_DATA_DIR/bin:$MISE_DATA_DIR/shims:$PATH"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD" .
      else
        gitleaks git --config .gitleaks.toml --redact --no-banner .
      fi
    # The checkout as it stands; caches and build output are allow-listed in .gitleaks.toml.
    - gitleaks dir --config .gitleaks.toml --redact --no-banner .

security:dependencies:
  stage: security
  extends: [.pnpm]
  needs: []
  variables:
    MISE_TOOLS: osv-scanner
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "nightly"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  script:
    - pnpm lint:licences
    - pnpm lint:vulns

# Proves a merge-request job can't read any secret (10 M0), even when it declares the secret's
# environment: those variables are protected, and MR pipelines don't run on protected refs.
# ENV_SCOPE_CANARY, an unprotected variable scoped to each environment with the environment's
# name as its value (docs/deploy.md), proves the job really got that environment's variables, so
# the check can't pass vacuously. Prints only whether each variable is set. The environments and
# variables match docs/deploy.md's secrets table (scripts/src/ci/no-secrets-on-mr.test.ts).
security:no-secrets-on-mr:
  stage: security
  extends: .merge-requests
  image: $NODE_IMAGE
  needs: []
  parallel:
    matrix:
      - ENV: [release, renovate, production]
  environment:
    name: $ENV
    action: access
  script:
    - |
      if [ "${ENV_SCOPE_CANARY:-}" != "$ENV" ]; then
        echo "$ENV: ENV_SCOPE_CANARY is not \"$ENV\": this job didn't get the $ENV environment's variables, so the check below would prove nothing (docs/deploy.md)"
        exit 1
      fi
      exposed=0
      for name in RELEASE_DEPLOY_TOKEN RELEASE_DEPLOY_USER RELEASE_REGISTRY_TOKEN RELEASE_REGISTRY_USER RENOVATE_TOKEN GITHUB_COM_TOKEN CLOUDFLARE_API_TOKEN D1_DATABASE; do
        if [ -n "$(printenv "$name" || true)" ]; then echo "$ENV: $name is set"; exposed=1; else echo "$ENV: $name is not set"; fi
      done
      exit "$exposed"

# --- 6. publish (main and v* tags; release environment) ----------------------------------------

# Publishing waits for every gate: validate, tests, end-to-end tests and the security jobs.
.release:
  stage: publish
  extends: .main-and-tags
  interruptible: false
  environment:
    name: release
    action: prepare

.require-release-token: &require-release-token |
  if [ -z "${RELEASE_DEPLOY_TOKEN:-}" ] || [ -z "${RELEASE_DEPLOY_USER:-}" ]; then
    echo "RELEASE_DEPLOY_TOKEN and RELEASE_DEPLOY_USER (a deploy token with write_package_registry, in masked, protected variables scoped to the release environment) are not configured; no packages can be published (08 §6)."
    exit 1
  fi

# Protected container repositories refuse deploy tokens (they have no role), so images are pushed
# with a Maintainer-role project access token limited to the container registry (08 §6, F-9).
.require-registry-token: &require-registry-token |
  if [ -z "${RELEASE_REGISTRY_TOKEN:-}" ] || [ -z "${RELEASE_REGISTRY_USER:-}" ]; then
    echo "RELEASE_REGISTRY_TOKEN and RELEASE_REGISTRY_USER (a Maintainer-role project access token with only read_registry and write_registry, and its bot user name, in masked, protected variables scoped to the release environment) are not configured; no image can be pushed (08 §6)."
    exit 1
  fi

publish:packages:
  extends: [.release, .caches]
  image: $NODE_IMAGE
  # Manual until the release-path decision in M1c (issue #12): GitLab's protected npm packages
  # refuse the release deploy token ("Package protected"), and project access tokens can't be
  # scoped to the package registry. Nothing is published until then; main stays green.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v/
      when: manual
      allow_failure: true
  needs: [validate, test, test:worker, build:app, e2e, security:secrets, security:dependencies]
  variables:
    # A fresh clone, never a checkout left on the runner by another pipeline.
    GIT_STRATEGY: clone
    # The deploy token's user-level npm config: in the job container's own /tmp, outside
    # CI_PROJECT_DIR, so no artifact or cache can include it. pnpm ignores credentials in the
    # repository's .npmrc that name an environment variable, so the token is written literally.
    PUBLISH_NPMRC: /tmp/publish-packages.npmrc
  before_script:
    - *require-release-token
    - scripts/ci/install-mise.sh pnpm
    - export PATH="$MISE_DATA_DIR/bin:$MISE_DATA_DIR/shims:$PATH"
    - *store-in-project
    # The packages were built in build:app; install without running any dependency's scripts.
    - pnpm install --frozen-lockfile --ignore-scripts
  script:
    # The project's own package registry, with the deploy token; never CI_JOB_TOKEN (08 §6). The
    # repository's .npmrc gets only the scope's registry; the credential goes in PUBLISH_NPMRC,
    # written by the printf builtin (no command line carries the token) with mode 0600, and
    # deleted in after_script.
    - REGISTRY="${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/"
    - echo "@your-move:registry=https:${REGISTRY}" >> .npmrc
    - (umask 077 && printf '%s:_authToken=%s\n' "$REGISTRY" "$RELEASE_DEPLOY_TOKEN" > "$PUBLISH_NPMRC")
    - export NPM_CONFIG_USERCONFIG="$PUBLISH_NPMRC"
    # Publishes every non-private package whose version isn't in the registry yet. Until the first
    # packages leave "private": true (M1), there is nothing to publish.
    - pnpm exec changeset publish
  after_script:
    - rm -f "$PUBLISH_NPMRC"

publish:image:
  extends: .release
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  variables:
    # Pushes only the build jobs' artifacts: no checkout at all.
    GIT_STRATEGY: none
  needs:
    - validate
    - test
    - test:worker
    - build:app
    - build:image:amd64
    - build:image:arm64
    - e2e
    - security:secrets
    - security:dependencies
  before_script:
    - *require-registry-token
    - printf '%s' "$RELEASE_REGISTRY_TOKEN" | crane auth login "$CI_REGISTRY" -u "$RELEASE_REGISTRY_USER" --password-stdin
  script:
    - crane push images/image-amd64.tar "$IMAGE_REPOSITORY:$CI_COMMIT_SHA-amd64"
    - crane push images/image-arm64.tar "$IMAGE_REPOSITORY:$CI_COMMIT_SHA-arm64"
    - >-
      crane index append
      -m "$IMAGE_REPOSITORY:$CI_COMMIT_SHA-amd64"
      -m "$IMAGE_REPOSITORY:$CI_COMMIT_SHA-arm64"
      -t "$IMAGE_REPOSITORY:$CI_COMMIT_SHA"
    - '[ -z "$CI_COMMIT_TAG" ] || crane tag "$IMAGE_REPOSITORY:$CI_COMMIT_SHA" "$CI_COMMIT_TAG"'
    # Deployments pull by digest (08 §6, 09 §4); record it for the smoke job (release notes: M1).
    - DIGEST="$(crane digest "$IMAGE_REPOSITORY:$CI_COMMIT_SHA")"
    - echo "IMAGE_REF=$IMAGE_REPOSITORY@$DIGEST" | tee image.env
  artifacts:
    paths: [images/*.cdx.json, sbom/]
    reports:
      dotenv: image.env

# Pulls the pushed image by digest as a service and checks /api/health (09 §6).
publish:smoke:
  stage: publish
  extends: .main-and-tags
  image: $CURL_IMAGE
  needs: [publish:image]
  services:
    - name: $IMAGE_REF
      alias: app
  variables:
    PUBLIC_URL: https://smoke.invalid
    APP_SECRET: c21va2UtdGVzdC1vbmx5LW5vdC1hLXJlYWwtc2VjcmV0LTAxMjM0NTY3 # gitleaks:allow
    EMAIL_PROVIDER: smtp
    SMTP_URL: smtp://smoke.invalid
    EMAIL_FROM: no-reply@smoke.invalid
    OPERATOR_CONTACT: ops@smoke.invalid
  script:
    - for i in $(seq 1 30); do curl -fsS http://app:8080/api/health && exit 0; sleep 2; done; exit 1

# --- Scheduled ---------------------------------------------------------------------------------

# The only job that receives RENOVATE_TOKEN: a protected variable scoped to this environment.
renovate:
  stage: validate
  image: $RENOVATE_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "renovate"
  interruptible: false
  timeout: 30 minutes
  environment:
    name: renovate
    action: access
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    - |
      if [ -z "${RENOVATE_TOKEN:-}" ]; then
        echo "RENOVATE_TOKEN (protected, scoped to the renovate environment) is not configured."
        exit 1
      fi
    - renovate
